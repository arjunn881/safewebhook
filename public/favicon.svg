<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="swh-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#23649e"/>
      <stop offset="100%" stop-color="#164c7d"/>
    </linearGradient>
    <filter id="swh-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0.5" stdDeviation="0.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Rounded Squircle Base matching reference image -->
  <rect width="32" height="32" rx="8" fill="url(#swh-bg)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" stroke="#60a5fa" stroke-opacity="0.3" stroke-width="1"/>
  
  <!-- Bold SWH Lettering -->
  <text x="16" y="20.5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="10.5" letter-spacing="-0.3" filter="url(#swh-shadow)">SWH</text>
</svg>